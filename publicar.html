<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publicar objeto - Objetos UDB</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark navbar-udb">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="dashboard.html">

            <img src="imagenes.img/logo-udb.png" alt="Universidad Don Bosco" style="height:42px;width:29px;object-fit:contain;margin-right:8px"> Objetos UDB

        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="dashboard.html">

                        Dashboard

                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="objetos.html">

                        Buscar objetos

                    </a>

                </li>

                <li class="nav-item">

                    <button
                        class="btn btn-light ms-lg-2"
                        onclick="cerrarSesion()">

                        Cerrar sesión

                    </button>

                </li>

            </ul>

        </div>

    </div>

</nav>



<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg">

                <div class="card-body p-4">

                    <h2 class="text-center mb-2">
                        📦 Registrar objeto
                    </h2>

                    <p class="text-center text-muted mb-4">

                        Reporta un objeto perdido o encontrado

                    </p>


                    <div
                        id="mensaje"
                        class="alert d-none">
                    </div>


                    <form id="formPublicar">


                        <div class="mb-3">

                            <label
                                class="form-label"
                                for="nombreObjeto">

                                Nombre del objeto

                            </label>

                            <input
                                type="text"
                                id="nombreObjeto"
                                class="form-control"
                                placeholder="Ejemplo: Celular Samsung">

                        </div>


                        <div class="mb-3">

                            <label
                                class="form-label"
                                for="categoria">

                                Categoría

                            </label>

                            <select
                                id="categoria"
                                class="form-select">

                                <option value="">
                                    Seleccione una categoría
                                </option>

                                <option value="Electrónico">
                                    Electrónico
                                </option>

                                <option value="Documentos">
                                    Documentos
                                </option>

                                <option value="Accesorios">
                                    Accesorios
                                </option>

                                <option value="Ropa">
                                    Ropa
                                </option>

                                <option value="Llaves">
                                    Llaves
                                </option>

                                <option value="Otros">
                                    Otros
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label
                                class="form-label"
                                for="descripcion">

                                Descripción

                            </label>

                            <textarea
                                id="descripcion"
                                class="form-control"
                                rows="4"
                                placeholder="Describe el objeto...">
                            </textarea>

                        </div>


                        <div class="mb-3">

                            <label
                                class="form-label"
                                for="ubicacion">

                                Lugar donde se perdió/encontró

                            </label>

                            <input
                                type="text"
                                id="ubicacion"
                                class="form-control"
                                placeholder="Ejemplo: Biblioteca UDB">

                        </div>


                        <div class="mb-3">

                            <label
                                class="form-label"
                                for="fecha">

                                Fecha

                            </label>

                            <input
                                type="date"
                                id="fecha"
                                class="form-control">

                        </div>


                        <div class="mb-4">

                            <label
                                class="form-label"
                                for="estado">

                                Estado

                            </label>

                            <select
                                id="estado"
                                class="form-select">

                                <option value="">
                                    Seleccione
                                </option>

                                <option value="Perdido">
                                    Perdido
                                </option>

                                <option value="Encontrado">
                                    Encontrado
                                </option>

                            </select>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            📦 Registrar objeto

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</main>



<script src="js/auth.js"></script>
<script src="js/publicar.js"></script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
